name: Release integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: release-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact public documentation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - <<'PYVERIFY'
          """Docs-only release integrity check. Fixed GitHub API; never executes repository content."""
          import base64
          import hashlib
          import json
          import os
          import re
          from urllib.request import Request, urlopen
          
          REPOSITORY = 'etsarkov/setupkit-ai'
          
          def validate(payload):
              manifest = json.loads(payload['.github/release-manifest.json'])
              hashes = manifest['files']
              assert manifest['schema'] == 'setupkit.docs-integrity.1'
              assert set(payload) == set(hashes) | {'.github/release-manifest.json', '.github/workflows/validate.yml'}
              for name, expected in hashes.items():
                  assert name and not name.startswith('/') and '..' not in name.split('/') and '\\' not in name
                  assert re.fullmatch('[a-f0-9]{64}', expected)
                  assert hashlib.sha256(payload[name]).hexdigest() == expected, 'Content mismatch: ' + name
              release = json.loads(payload['release.json'])
              assert release['schema_version'] == 2
              # Version aliases are mathematical identities, independent of packaging replacements.
              for name in ('modules/edition-review.md', 'COMPLETE.md'):
                  pairs = re.findall(r'edition (\d+\.\d+(?:\.\d+)?) represents numeric version (\d+\.\d+(?:\.\d+)?)', payload[name].decode())
                  assert len(pairs) == 3, 'Missing historical aliases: ' + name
                  for left, right in pairs:
                      left_parts = left.split('.')
                      right_parts = right.split('.')
                      assert tuple(map(int, left_parts + ['0'] * (3-len(left_parts)))) == tuple(map(int, right_parts + ['0'] * (3-len(right_parts)))), 'Invalid edition alias: ' + name
                  assert set(pairs) == {('0.17', '0.17.0'), ('0.18', '0.18.0'), ('0.19', '0.19.0')}, 'Historical aliases changed: ' + name
              assert not {'published_at', 'public_source_verified', 'website_deployed', 'supported_hosts_verified'} & release.keys()
              assert release['publication_status_url'] == 'https://api.github.com/repos/etsarkov/setupkit-ai/releases/tags/' + release['planned_ref']
              edition_line = 'Edition: ' + release['version'] + '. Updated: ' + release['revision_date'] + '.'
              assert edition_line in payload['STARTER.md'].decode()
              assert edition_line in payload['COMPLETE.md'].decode()
              assert hashlib.sha256(payload['STARTER.md']).hexdigest() == release['starter_sha256']
              assert hashlib.sha256(payload['START_PROMPT.txt']).hexdigest() == release['start_prompt_sha256']
              assert ('END OF SETUPKIT CORE ' + release['version'] + ' ' + release['revision_date']) in payload['STARTER.md'].decode()
              distribution = json.loads(payload['distribution.json'])
              assert distribution['edition'] == release['version']
              assert distribution['core_sha256'] == release['starter_sha256']
              assert hashlib.sha256(payload['COMPLETE.md']).hexdigest() == distribution['complete_sha256']
              assert ('END OF SETUPKIT ' + release['version'] + ' ' + release['revision_date']) in payload['COMPLETE.md'].decode()
              for block in distribution['blocks']:
                  assert hashlib.sha256(payload[block['path']]).hexdigest() == block['sha256']
              assert release['planned_ref'] == 'setupkit-v' + release['version']
              for name, data in payload.items():
                  if name.endswith(('.md', '.txt', '.json')):
                      assert b'AI_WORK_SETUP_STARTER.md' not in data, 'Old public filename: ' + name
                      assert b'blob/starter-' not in data, 'Old public tag: ' + name
              assert release['guide_license']['id'] == 'CC-BY-4.0'
              assert release['supporting_document_license']['id'] == 'CC-BY-4.0'
              return True
          
          def read_tree(get_json, sha):
              assert re.fullmatch('[a-f0-9]{40}', sha)
              tree = get_json('/git/trees/' + sha + '?recursive=1')
              assert tree.get('truncated') is False
              payload = {}
              for item in tree['tree']:
                  assert item['type'] in ('tree', 'blob')
                  assert item['mode'] in ('040000', '100644')
                  if item['type'] == 'blob':
                      assert re.fullmatch('[a-f0-9]{40}', item['sha'])
                      assert item['path'] not in payload
                      blob = get_json('/git/blobs/' + item['sha'])
                      assert blob['encoding'] == 'base64'
                      raw = base64.b64decode(''.join(blob['content'].split()), validate=True)
                      assert len(raw) <= 200000
                      assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == item['sha']
                      payload[item['path']] = raw
              return payload
          
          def main():
              assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
              token = os.environ['GH_TOKEN']
              class NoRedirect(__import__('urllib.request', fromlist=['HTTPRedirectHandler']).HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      raise RuntimeError('Redirect denied')
              opener = __import__('urllib.request', fromlist=['build_opener']).build_opener(NoRedirect())
              def get_json(endpoint):
                  assert re.fullmatch(r'/git/(?:trees/[a-f0-9]{40}\?recursive=1|blobs/[a-f0-9]{40})', endpoint)
                  request = Request('https://api.github.com/repos/' + REPOSITORY + endpoint,
                                    headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'})
                  with opener.open(request, timeout=20) as response:
                      raw = response.read(1000001)
                      assert len(raw) <= 1000000
                      return json.loads(raw)
              validate(read_tree(get_json, os.environ['GITHUB_SHA']))
              print('PASS: exact reviewed documentation tree and starter metadata')
          
          if __name__ == '__main__':
              main()
          PYVERIFY
